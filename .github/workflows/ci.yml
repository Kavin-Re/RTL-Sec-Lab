name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Every solution passes its grader; every starter fails cleanly
        run: python -m rtlseclab.check --starters
      - name: Grader tests (starters in sync, mutants caught, standalone, ORIGIN headers)
        run: python -m unittest -v tests.test_graders
      - name: Student export contains no solutions
        run: |
          python -m rtlseclab.tools.make_student_kit "$RUNNER_TEMP/student"
          ! find "$RUNNER_TEMP/student" -name 'solution.py' -o -name 'answer_key.md' | grep .
          cd "$RUNNER_TEMP/student" && ! python labs/lab1_lfsr_break/grader.py labs/lab1_lfsr_break/starter.py

  seed-robustness:
    # Tolerance bands must hold for seed streams other than the default one. Slow, so not on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_robustness.py 20 4
